name: test

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: bash -n run.sh scripts/*.sh
      - run: python -m json.tool model-manifest.json >/dev/null
      - run: for workflow in workflows/*.json; do python -m json.tool "$workflow" >/dev/null; done
